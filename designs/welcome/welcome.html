<style>
        body {
            background-color: #f9f9f8;
            font-family: 'Hanken Grotesk', sans-serif;
            overflow: hidden; /* Prevent scrolling during animation */
        }
        .nuchter-card {
            border: 1px solid #c2c8c7;
            box-shadow: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .header-bold { font-weight: 700; }
        .body-light { font-weight: 300; }

        /* Animation Overlay Styles */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #intro-logo {
            position: absolute;
            height: 120px;
            width: auto;
            transform: translateX(200vw);
        }

        @keyframes slideAndBrake {
            0% {
                transform: translateX(150vw);
            }
            70% {
                transform: translateX(-50px); /* Slight overshoot */
            }
            100% {
                transform: translateX(0); /* Snap back */
            }
        }

        .animate-slide-brake {
            animation: slideAndBrake 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .hidden-content {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .visible-content {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center bg-background text-on-background">
<!-- Intro Animation Overlay -->
<div id="intro-overlay">
<img alt="Logo Animation" id="intro-logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtXdrDu5nRei78-2fBAjFRsi9_2R6QiaHF0pIZ-_Bh-5akS9WF2rALr94Oa8Tk7Nt89bjw61h69a7nlIHCKnJB82vTFpKMjCB9k-oCpU0TjLwTKaXhs38YbVUGecLVmtSm5DYSObD8rhFtHALY0IHS9H3RI0r-Hi32h5bfVRvoC1Fw3AOBzsVkwjhMphy4KPmLaVz7ZA_bJGnv4-lI3VNnb-oKpXlT6HJckHUHEQFX7zS3tiez6R1RaujDxTfyT5Wc4NuMQwgICKjK"/>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('intro-overlay');
            const introLogo = document.getElementById('intro-logo');
            const mainContent = document.getElementById('main-content');
            const footerContent = document.getElementById('footer-content');

            // 1. Start the Logo slide and brake after a tiny delay
            setTimeout(() => {
                introLogo.classList.add('animate-slide-brake');
            }, 300);

            // 2. Sequence phase: Once brake animation finishes (approx 1.1s total)
            setTimeout(() => {
                // Fade out the overlay and the intro logo
                overlay.classList.add('fade-out');

                // Allow scrolling again
                document.body.style.overflow = 'auto';

                // Reveal main content
                setTimeout(() => {
                    overlay.style.display = 'none';
                    mainContent.classList.remove('hidden-content');
                    mainContent.classList.add('visible-content');
                    footerContent.classList.remove('hidden-content');
                    footerContent.classList.add('visible-content');
                }, 500); // Wait for overlay fade out
            }, 1800);
        });
    </script>
