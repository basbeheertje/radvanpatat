name: Update release content

on:
    release:
        types:
            - published
            - edited
            - deleted

    workflow_dispatch:

permissions:
    actions: write
    contents: write

concurrency:
    group: changelog-and-pages
    cancel-in-progress: false

jobs:
    generate:
        name: Generate release content
        runs-on: ubuntu-latest

        steps:
            - name: Repository ophalen
              uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0

            - name: Node.js installeren
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            # This workflow runs from a release tag context. Generated files are
            # committed to main so Pages always deploys the protected branch.
            - name: Changelog genereren
              run: npm run generate:changelog
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Roadmap genereren
              run: npm run generate:roadmap
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Gegenereerde bestanden committen
              id: release_content
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add CHANGELOG.md
                  git add src/frontend/changelog.html
                  git add src/frontend/assets/js/roadmap-data.js

                  if git diff --cached --quiet; then
                    echo "Geen wijzigingen gevonden."
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git commit -m "docs: update release content"
                  git push origin HEAD:main
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            # Pushes authenticated with GITHUB_TOKEN cannot trigger another
            # workflow, so Pages must be dispatched after main is updated.
            - name: GitHub Pages deployment starten
              if: steps.release_content.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
