name: Label closed issue

on:
    issues:
        types:
            - closed

permissions:
    issues: write
    contents: read

jobs:
    label-issue:
        name: Add in production label
        runs-on: ubuntu-latest

        steps:
            - name: Ensure label exists
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPOSITORY: ${{ github.repository }}
              shell: bash
              run: |
                  gh label create "in production" \
                    --repo "$REPOSITORY" \
                    --description "Deze wijziging staat in productie" \
                    --color "1F883D" \
                    --force

            - name: Add label to issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_URL: ${{ github.event.issue.html_url }}
              run: gh issue edit "$ISSUE_URL" --add-label "in production"